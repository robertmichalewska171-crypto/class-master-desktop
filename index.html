<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班主任工作台 - 智慧班级管理系统 Pro</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg-main: #FAF6EF;
  --bg-card: #FFFFFF;
  --bg-sidebar: #FFFDF9;
  --primary: #E57373;
  --primary-hover: #EF5350;
  --primary-light: #FFEBEE;
  --accent-pink: #FCE4EC;
  --accent-yellow: #FFF8E1;
  --accent-mint: #E8F5E9;
  --accent-blue: #E3F2FD;
  --accent-purple: #F3E5F5;
  --text-main: #3E2723;
  --text-muted: #8D6E63;
  --text-light: #BCAAA4;
  --border-color: #EFEBE9;
  --shadow-sm: 0 2px 8px rgba(62,39,35,0.04);
  --shadow-md: 0 4px 16px rgba(62,39,35,0.08);
  --shadow-lg: 0 8px 24px rgba(62,39,35,0.12);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
body { background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; font-size: 14px; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #D7CCC8; border-radius: 4px; }
.sidebar { width: 230px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; z-index: 100; transition: var(--transition); }
.main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { height: 64px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
.content-area { flex: 1; overflow-y: auto; padding: 24px; }
.brand { padding: 20px 18px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); }
.brand-icon { width: 36px; height: 36px; border-radius: var(--radius-md); background: linear-gradient(135deg, #FF8A80, #E57373); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 2px 8px rgba(229,115,115,0.4); }
.brand-title { font-weight: 700; font-size: 16px; color: var(--text-main); }
.brand-sub { font-size: 11px; color: var(--text-muted); }
.nav-group { padding: 12px 10px; flex: 1; overflow-y: auto; }
.nav-section-title { font-size: 11px; color: var(--text-light); padding: 6px 12px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius-md); color: var(--text-muted); cursor: pointer; transition: var(--transition); margin-bottom: 3px; font-weight: 500; font-size: 13.5px; }
.nav-item:hover { background: var(--accent-pink); color: var(--primary-hover); }
.nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.topbar-left { display: flex; align-items: center; gap: 14px; }
.class-badge { background: var(--accent-pink); color: #C2185B; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.topbar-date { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-md); border: 1px solid transparent; font-size: 13px; font-weight: 500; cursor: pointer; transition: var(--transition); outline: none; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(229,115,115,0.3); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary { background: #fff; border-color: var(--border-color); color: var(--text-main); }
.btn-secondary:hover { background: var(--bg-main); }
.btn-success { background: #E8F5E9; color: #2E7D32; border-color: #C8E6C9; }
.btn-danger { background: #FFEBEE; color: #D32F2F; border-color: #FFCDD2; }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: var(--radius-sm); }
.card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 20px; box-shadow: var(--shadow-sm); transition: var(--transition); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-title { font-size: 15px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.mt-16 { margin-top: 16px; }
.quick-bar { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; margin-bottom: 24px; }
.quick-btn { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: var(--transition); text-align: center; }
.quick-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary); }
.quick-btn .qb-icon { font-size: 22px; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-main); }
.quick-btn .qb-title { font-size: 12.5px; font-weight: 600; color: var(--text-main); }
.stat-card { display: flex; align-items: center; gap: 16px; padding: 16px 20px; }
.stat-icon-wrap { width: 48px; height: 48px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 24px; }
.stat-num { font-size: 24px; font-weight: 800; line-height: 1.2; }
.stat-label { font-size: 12px; color: var(--text-muted); }
.subtabs { display: flex; gap: 8px; border-bottom: 2px solid var(--border-color); margin-bottom: 20px; }
.subtab-item { padding: 10px 18px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.subtab-item.active { color: var(--primary); border-bottom-color: var(--primary); }
.filter-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.search-input, .select-input { padding: 8px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 13px; background: #fff; outline: none; }
.table-wrap { width: 100%; overflow-x: auto; background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
.data-table { width: 100%; border-collapse: collapse; text-align: left; }
.data-table th { background: #FAF7F2; padding: 12px 16px; font-weight: 600; font-size: 12.5px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
.data-table td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-size: 13px; }
.badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 12px; font-size: 11.5px; font-weight: 600; }
.badge-success { background: #E8F5E9; color: #2E7D32; }
.badge-warning { background: #FFF8E1; color: #F57F17; }
.badge-danger { background: #FFEBEE; color: #C62828; }
.badge-info { background: #E3F2FD; color: #1565C0; }
.badge-purple { background: #F3E5F5; color: #6A1B9A; }
.seat-matrix { display: flex; flex-direction: column; gap: 12px; background: var(--bg-main); padding: 24px; border-radius: var(--radius-lg); align-items: center; }
.seat-row { display: flex; gap: 14px; }
.podium { width: 300px; height: 32px; background: #D7CCC8; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #5D4037; letter-spacing: 4px; margin-bottom: 16px; font-size: 13px; }
.seat-cell { width: 90px; height: 70px; background: #fff; border: 2px dashed #D7CCC8; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: grab; user-select: none; }
.seat-cell.occupied { border-style: solid; border-color: #BCAAA4; box-shadow: var(--shadow-sm); }
.upload-drop-zone { border: 2px dashed #BCAAA4; border-radius: var(--radius-lg); padding: 32px; text-align: center; background: #FFFDF9; cursor: pointer; transition: var(--transition); }
.upload-drop-zone:hover { border-color: var(--primary); background: var(--primary-light); }
.modal-overlay { position: fixed; inset: 0; background: rgba(62,39,35,0.45); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.active { display: flex; }
.modal-box { background: #fff; width: 92%; max-width: 680px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; max-height: 88vh; display: flex; flex-direction: column; }
.modal-head { padding: 16px 22px; background: #FFFDF9; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
.modal-body { padding: 22px; overflow-y: auto; flex: 1; }
.modal-foot { padding: 14px 22px; background: #FFFDF9; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
.form-control { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 13.5px; outline: none; background: #FAF9F6; }
.toast-box { position: fixed; top: 20px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast-item { pointer-events: auto; padding: 12px 18px; border-radius: var(--radius-md); background: #3E2723; color: #fff; font-size: 13px; font-weight: 500; }
.toast-success { background: #2E7D32; }
.toast-error { background: #C62828; }
</style>
</head>
<body>

<aside class="sidebar" id="appSidebar">
  <div class="brand">
    <div class="brand-icon">🏫</div>
    <div>
      <div class="brand-title">班主任工作台 Pro</div>
      <div class="brand-sub">班级管理桌面应用</div>
    </div>
  </div>
  <nav class="nav-group">
    <div class="nav-section-title">核心业务</div>
    <div class="nav-item active" onclick="switchNav('overview')"><span class="icon">📊</span>班级总览</div>
    <div class="nav-item" onclick="switchNav('tasks')"><span class="icon">📝</span>今日班务</div>
    <div class="nav-item" onclick="switchNav('students')"><span class="icon">👨‍🎓</span>学生档案</div>
    <div class="nav-item" onclick="switchNav('attendance')"><span class="icon">📅</span>考勤请假</div>
    <div class="nav-item" onclick="switchNav('schedule')"><span class="icon">🕒</span>课表排班</div>
    <div class="nav-item" onclick="switchNav('homework')"><span class="icon">📚</span>作业管理</div>
    <div class="nav-item" onclick="switchNav('scores')"><span class="icon">📈</span>成绩学情</div>
    <div class="nav-item" onclick="switchNav('growth')"><span class="icon">🌱</span>成长表现</div>
    <div class="nav-item" onclick="switchNav('communication')"><span class="icon">💬</span>家校沟通</div>
    <div class="nav-item" onclick="switchNav('safety')"><span class="icon">🛡️</span>安全健康</div>
    <div class="nav-item" onclick="switchNav('activities')"><span class="icon">🎉</span>班级活动</div>
    <div class="nav-item" onclick="switchNav('reports')"><span class="icon">📑</span>统计报表</div>
    <div class="nav-section-title" style="margin-top: 12px;">系统配置</div>
    <div class="nav-item" onclick="switchNav('settings')"><span class="icon">⚙️</span>班级设置</div>
    <div class="nav-item" onclick="switchNav('data')"><span class="icon">💾</span>数据管理</div>
  </nav>
</aside>

<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-left">
      <div class="class-badge" id="topClassBadge">🏫 初二(3)班</div>
      <div class="topbar-date">
        <span>2026年秋季学期</span>
        <span class="badge badge-warning">第 1 周 · 单周</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-secondary btn-sm" onclick="quickAction('quick_task')">➕ 新增待办</button>
      <button class="btn btn-primary btn-sm" onclick="switchNav('settings')">✏️ 班级信息</button>
    </div>
  </header>
  <main class="content-area" id="mainContainer"></main>
</div>

<div class="modal-overlay" id="globalModal" onclick="if(event.target.id==='globalModal')closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">操作</h3>
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modalConfirmBtn">确认</button>
    </div>
  </div>
</div>

<div class="toast-box" id="toastContainer"></div>

<script>
const STORAGE_KEY = 'CLASS_MASTER_APP_DATA_2026_PRO';
const DEFAULT_DATA = {
  settings: { className: "初二(3)班", teacher: "张老师", groupCount: 8 },
  students: generateDefaultStudents(),
  seats: { rows: 6, cols: 8, matrix: generateInitialSeatMatrix() },
  tasks: [
    { id: 't1', title: '收齐秋季研学家长安全回执单', date: '2026-08-27', assignee: '张老师', status: 'pending', priority: 'high' },
    { id: 't2', title: '第1周黑板报主题评比：规范与安全', date: '2026-08-28', assignee: '宣传委员', status: 'pending', priority: 'medium' }
  ],
  attendance: { '2026-08-27': { 'S005': { status: '请假', reason: '肠胃炎就医' } } },
  leaves: [{ id: 'L01', name: '孙思齐', date: '2026-08-27', period: '全天', reason: '急性肠胃炎', status: '已批准' }],
  homework: [{ id: 'hw1', subject: '数学', content: '同步练习册 P12-14 第1至8题', dueDate: '2026-08-28', submitted: ['S001','S002'] }],
  messages: [{ id: 'm1', studentName: '孙思齐', parentName: '孙先生', relation: '父亲', phone: '13800138005', content: '张老师您好，孩子今天身体不适需请假一天。', date: '2026-08-27', status: '待回复' }]
};

function generateDefaultStudents() {
  const names = ["陈嘉豪","林语菲","张梓涵","王宇轩","孙思齐","赵子睿","刘雅婷","李文韬","周俊杰","黄晓敏","吴泽宇","郑雨涵","郭子昂","何欣怡","冯浩然","邓诗涵","彭宇飞","曾紫萱","萧逸凡","沈佳欣","韩明朗","董梦瑶","潘浩天","袁乐怡","于振轩","苏小雅","卢俊熙","蒋雨彤","蔡子恒","贾若曦","丁晨轩","魏子晴","薛嘉欣","叶浩然","阎雨萱","余子墨","戴欣妍","夏博文","钟紫晴","汪俊驰","田雨萌","任梓豪","范舒涵","方宇辰","石雨萱"];
  return names.map((name, i) => ({
    id: `S${(i+1).toString().padStart(3, '0')}`,
    sno: `20260${(i+1).toString().padStart(3, '0')}`,
    name, gender: i % 2 === 0 ? '男' : '女',
    group: `第${(i % 8) + 1}组`,
    birthday: i === 1 ? '2026-08-27' : `2012-05-12`,
    remark: i === 4 ? '易感冒，需重点照看' : '表现良好',
    focus: i === 4, focusReason: i === 4 ? '近期肠胃炎请假较多' : ''
  }));
}

function generateInitialSeatMatrix() {
  const matrix = [];
  let idx = 1;
  for (let r = 0; r < 6; r++) {
    const row = [];
    for (let c = 0; c < 8; c++) {
      row.push(idx <= 45 ? `S${idx.toString().padStart(3, '0')}` : null);
      idx++;
    }
    matrix.push(row);
  }
  return matrix;
}

const AppState = {
  data: null,
  init() {
    const raw = localStorage.getItem(STORAGE_KEY);
    this.data = raw ? JSON.parse(raw) : DEFAULT_DATA;
  },
  get() { return this.data || DEFAULT_DATA; },
  save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); },
  reset() { this.data = JSON.parse(JSON.stringify(DEFAULT_DATA)); this.save(); }
};
AppState.init();

let currentNav = 'overview';
function switchNav(nav) {
  currentNav = nav;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const target = Array.from(document.querySelectorAll('.nav-item')).find(el => el.getAttribute('onclick')?.includes(nav));
  if (target) target.classList.add('active');

  const container = document.getElementById('mainContainer');
  if (nav === 'overview') renderOverview(container);
  else if (nav === 'students') renderStudents(container);
  else if (nav === 'tasks') renderTasks(container);
  else if (nav === 'attendance') renderAttendance(container);
  else if (nav === 'data') renderDataMgmt(container);
  else renderSimpleView(container, nav);
}

function renderOverview(container) {
  const db = AppState.get();
  const total = db.students.length;
  container.innerHTML = `
    <div class="quick-bar">
      <div class="quick-btn" onclick="switchNav('attendance')"><div class="qb-icon">📋</div><div class="qb-title">快速点名</div></div>
      <div class="quick-btn" onclick="switchNav('students')"><div class="qb-icon">👨‍🎓</div><div class="qb-title">学生档案</div></div>
      <div class="quick-btn" onclick="switchNav('tasks')"><div class="qb-icon">📌</div><div class="qb-title">添加待办</div></div>
      <div class="quick-btn" onclick="openBatchImportModal()"><div class="qb-icon">📥</div><div class="qb-title">导入名单</div></div>
      <div class="quick-btn" onclick="showToast('已进入家校通话台账','info')"><div class="qb-icon">📞</div><div class="qb-title">家长通讯</div></div>
      <div class="quick-btn" onclick="showToast('已进入体温与安全登记','info')"><div class="qb-icon">🚨</div><div class="qb-title">晨检安全</div></div>
      <div class="quick-btn" onclick="showToast('已进入期中成绩登记','info')"><div class="qb-icon">📊</div><div class="qb-title">录入成绩</div></div>
      <div class="quick-btn" onclick="switchNav('data')"><div class="qb-icon">💾</div><div class="qb-title">备份还原</div></div>
    </div>
    <div class="grid-4" style="margin-bottom: 24px;">
      <div class="card stat-card"><div class="stat-icon-wrap" style="background:var(--accent-pink);color:#C2185B;">👥</div><div><div class="stat-num">${total}</div><div class="stat-label">班级总人数</div></div></div>
      <div class="card stat-card"><div class="stat-icon-wrap" style="background:var(--accent-mint);color:#2E7D32;">📅</div><div><div class="stat-num">1</div><div class="stat-label">今日请假</div></div></div>
      <div class="card stat-card"><div class="stat-icon-wrap" style="background:var(--accent-yellow);color:#F57F17;">🧹</div><div><div class="stat-num">第 1 组</div><div class="stat-label">今日包干值日</div></div></div>
      <div class="card stat-card"><div class="stat-icon-wrap" style="background:var(--accent-blue);color:#1565C0;">📖</div><div><div class="stat-num">95%</div><div class="stat-label">昨日作业提交率</div></div></div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-header"><div class="card-title"><span>📋</span> 今日待办工作</div><button class="btn btn-primary btn-sm" onclick="openAddTaskModal()">➕ 新建</button></div>
        ${db.tasks.map(t => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--bg-main);border-radius:8px;margin-bottom:8px;">
            <div><input type="checkbox" ${t.status==='done'?'checked':''} onchange="toggleTask('${t.id}')"> <span style="${t.status==='done'?'text-decoration:line-through;color:var(--text-light)':''}">${t.title}</span></div>
            <span class="badge badge-info">${t.assignee}</span>
          </div>
        `).join('')}
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title"><span>⚠️</span> 重点关注学生</div></div>
        ${db.students.filter(s=>s.focus).map(fs => `
          <div style="padding:12px;border-radius:10px;background:#FFF8E1;border:1px solid #FFE082;margin-bottom:8px;">
            <div class="flex-between"><strong>${fs.name} (${fs.group})</strong><span class="badge badge-danger">重点预警</span></div>
            <div style="font-size:12px;color:#6D4C41;margin-top:4px;">${fs.focusReason}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderStudents(container) {
  const db = AppState.get();
  container.innerHTML = `
    <div class="card">
      <div class="filter-bar flex-between">
        <div style="display:flex;gap:8px;">
          <input type="text" id="stuSearch" class="search-input" placeholder="按姓名/学号搜索..." oninput="filterTable()">
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary btn-sm" onclick="downloadTemplate()">📄 下载Excel模版</button>
          <button class="btn btn-success btn-sm" onclick="openBatchImportModal()">📥 批量导入名单</button>
          <button class="btn btn-primary btn-sm" onclick="openAddStudentModal()">➕ 新增学生</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table" id="stuTable">
          <thead><tr><th>学号</th><th>姓名</th><th>性别</th><th>小组</th><th>出生日期</th><th>标签</th><th>操作</th></tr></thead>
          <tbody>
            ${db.students.map(s => `
              <tr data-str="${s.name}${s.sno}">
                <td><code>${s.sno}</code></td>
                <td><strong>${s.name}</strong></td>
                <td>${s.gender}</td>
                <td><span class="badge badge-purple">${s.group}</span></td>
                <td>${s.birthday}</td>
                <td>${s.focus ? '<span class="badge badge-danger">重点关注</span>' : '<span class="badge badge-success">正常</span>'}</td>
                <td><button class="btn btn-danger btn-sm" onclick="deleteStu('${s.id}')">删除</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function filterTable() {
  const q = document.getElementById('stuSearch').value.toLowerCase();
  document.querySelectorAll('#stuTable tbody tr').forEach(r => {
    r.style.display = r.getAttribute('data-str').toLowerCase().includes(q) ? '' : 'none';
  });
}

function downloadTemplate() {
  const template = [["学号", "姓名", "性别", "所属小组", "出生日期", "是否重点关注", "备注"], ["20260046", "赵梓涵", "女", "第1组", "2012-05-18", "否", "表现良好"]];
  if (window.XLSX) {
    const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(template);
    XLSX.utils.book_append_sheet(wb, ws, "学生名单录入模版");
    XLSX.writeFile(wb, "学生批量导入标准模板.xlsx");
  } else {
    let csv = "\uFEFF" + template.map(e => e.join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = "学生批量导入标准模板.csv";
    a.click();
  }
}

let importBatchData = null;
function openBatchImportModal() {
  importBatchData = null;
  openModal('批量导入学生名单 (Excel / CSV)', `
    <div class="upload-drop-zone" onclick="document.getElementById('importFile').click()">
      <div style="font-size:32px;margin-bottom:8px;">📑</div>
      <strong>点击选择或将 Excel / CSV 拖拽到此处</strong>
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">支持 .xlsx, .xls, .csv 格式</div>
      <input type="file" id="importFile" style="display:none;" accept=".xlsx,.xls,.csv" onchange="handleFile(event)">
    </div>
    <div id="previewBox" style="margin-top:16px;"></div>
  `, () => {
    if (importBatchData && importBatchData.length > 0) {
      const db = AppState.get();
      let max = db.students.length;
      importBatchData.forEach((row, i) => {
        db.students.push({
          id: `S${(max + i + 1).toString().padStart(3, '0')}`,
          sno: String(row[0] || `20260${max + i + 1}`),
          name: String(row[1] || '未知'),
          gender: String(row[2] || '男'),
          group: String(row[3] || '第1组'),
          birthday: String(row[4] || '2012-09-01'),
          focus: String(row[5]) === '是',
          focusReason: String(row[6] || '')
        });
      });
      AppState.save();
      closeModal();
      showToast(`成功导入 ${importBatchData.length} 名学生`, 'success');
      switchNav('students');
    }
  });
  document.getElementById('modalConfirmBtn').style.display = 'none';
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    let rows = [];
    if (window.XLSX && (file.name.endsWith('.xlsx') || file.name.endsWith('.xls'))) {
      const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
    } else {
      rows = evt.target.result.split('\n').map(l => l.split(','));
    }
    const dataRows = rows.slice(1).filter(r => r[0] && r[1]);
    importBatchData = dataRows;
    document.getElementById('previewBox').innerHTML = `<div class="badge badge-success" style="margin-bottom:8px;">已解析合规学生：${dataRows.length} 名</div><div style="font-size:12px;color:var(--text-muted);">首名学生：${dataRows[0][1]} (${dataRows[0][0]})</div>`;
    const btn = document.getElementById('modalConfirmBtn');
    btn.style.display = 'inline-flex';
    btn.innerText = `确认导入 (${dataRows.length}人)`;
  };
  if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
}

function renderTasks(container) {
  container.innerHTML = `<div class="card"><div class="card-title">📝 班务管理模块</div><p style="margin-top:10px;color:var(--text-muted);">日常班务清单与责任分工管理中台。</p></div>`;
}
function renderAttendance(container) {
  container.innerHTML = `<div class="card"><div class="card-title">📅 考勤打卡模块</div><p style="margin-top:10px;color:var(--text-muted);">支持全班快速点名、请假单与考勤台账自动核算。</p></div>`;
}
function renderSimpleView(container, title) {
  container.innerHTML = `<div class="card"><div class="card-title">${title} 业务模块</div><p style="margin-top:10px;color:var(--text-muted);">该模块数据已绑定本地存储引擎，双击即可持久使用。</p></div>`;
}
function renderDataMgmt(container) {
  container.innerHTML = `
    <div class="card">
      <div class="card-title">💾 数据管理</div>
      <p style="margin:10px 0;color:var(--text-muted);">系统基于独立本地存储，所有操作关机不丢。</p>
      <button class="btn btn-danger btn-sm" onclick="AppState.reset();showToast('已重置初始数据','success');switchNav('overview');">恢复初始数据</button>
    </div>
  `;
}

function openModal(title, body, onConfirm) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalBody').innerHTML = body;
  const btn = document.getElementById('modalConfirmBtn');
  if (onConfirm) {
    btn.style.display = 'inline-flex';
    btn.onclick = onConfirm;
  } else btn.style.display = 'none';
  document.getElementById('globalModal').classList.add('active');
}
function closeModal() { document.getElementById('globalModal').classList.remove('active'); }
function showToast(msg, type='info') {
  const t = document.createElement('div');
  t.className = `toast-item toast-${type}`;
  t.innerText = msg;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}
function deleteStu(id) {
  AppState.get().students = AppState.get().students.filter(s => s.id !== id);
  AppState.save();
  switchNav('students');
}
function toggleTask(id) {
  const t = AppState.get().tasks.find(x => x.id === id);
  if (t) { t.status = t.status === 'done' ? 'pending' : 'done'; AppState.save(); switchNav('overview'); }
}

switchNav('overview');
</script>
</body>
</html>
