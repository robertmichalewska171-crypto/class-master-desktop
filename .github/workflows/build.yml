name: 自动构建班主任工作台桌面端

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 Rust 编译工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 组装工程并直接编译 EXE
        shell: bash
        run: |
          # 1. 隔离网页静态资源，防止递归打包多余文件
          mkdir -p dist
          cp index.html dist/index.html

          # 2. 建立 Tauri 工程目录
          mkdir -p src-tauri/src
          
          # 3. 写入 Cargo.toml (特性严格声明为 api-all，满足全部 API 校验)
          cat << 'EOF' > src-tauri/Cargo.toml
          [package]
          name = "class-master"
          version = "1.0.0"
          edition = "2021"

          [build-dependencies]
          tauri-build = { version = "1.5", features = [] }

          [dependencies]
          tauri = { version = "1.5", features = ["api-all"] }
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"

          [profile.release]
          panic = "abort"
          codegen-units = 1
          lto = true
          opt-level = "z"
          strip = true
          EOF

          # 4. 写入完整合规的 tauri.conf.json
          cat << 'EOF' > src-tauri/tauri.conf.json
          {
            "build": {
              "beforeDevCommand": "",
              "beforeBuildCommand": "",
              "devPath": "../dist",
              "distDir": "../dist"
            },
            "package": {
              "productName": "班主任工作台",
              "version": "1.0.0"
            },
            "tauri": {
              "allowlist": {
                "all": true
              },
              "bundle": {
                "active": false,
                "identifier": "com.classmaster.app"
              },
              "security": {
                "csp": null
              },
              "windows": [
                {
                  "title": "班主任工作台 - 智慧班级管理系统",
                  "width": 1280,
                  "height": 820,
                  "minWidth": 960,
                  "minHeight": 640,
                  "resizable": true
                }
              ]
            }
          }
          EOF

          # 5. 写入构建脚本与入口源码
          cat << 'EOF' > src-tauri/build.rs
          fn main() {
              tauri_build::build()
          }
          EOF

          cat << 'EOF' > src-tauri/src/main.rs
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]
          fn main() {
              tauri::Builder::default()
                  .run(tauri::generate_context!())
                  .expect("运行班主任工作台异常");
          }
          EOF

          # 6. 直接由 Cargo 工具链编译为独立 Release EXE
          cd src-tauri
          cargo build --release

          # 7. 导出最终成品
          cp target/release/class-master.exe ../班主任工作台.exe

      - name: 归档并导出 EXE 文件
        uses: actions/upload-artifact@v4
        with:
          name: 班主任工作台_Windows免安装版
          path: 班主任工作台.exe
