name: 自动构建班主任工作台桌面端

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 Rust 编译工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 组装工程并直接编译 EXE
        shell: powershell
        run: |
          # 1. 准备静态资源目录
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item index.html dist/index.html

          # 2. 准备源码与图标目录
          New-Item -ItemType Directory -Force -Path src-tauri/src
          New-Item -ItemType Directory -Force -Path src-tauri/icons

          # 3. 原生生成合规的 32x32 icon.ico (满足 Windows Resource 编译要求)
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 32, 32
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(229, 115, 115))
          $g.FillRectangle($brush, 0, 0, 32, 32)
          $hIcon = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $fs = New-Object System.IO.FileStream "src-tauri/icons/icon.ico", ([System.IO.FileMode]::Create)
          $icon.Save($fs)
          $fs.Close()
          $bmp.Dispose()
          $g.Dispose()

          # 4. 写入 Cargo.toml (特性严格配置为 api-all)
          @'
          [package]
          name = "class-master"
          version = "1.0.0"
          edition = "2021"

          [build-dependencies]
          tauri-build = { version = "1.5", features = [] }

          [dependencies]
          tauri = { version = "1.5", features = ["api-all"] }
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"

          [profile.release]
          panic = "abort"
          codegen-units = 1
          lto = true
          opt-level = "z"
          strip = true
          '@ | Set-Content -Path src-tauri/Cargo.toml -Encoding UTF8

          # 5. 写入 tauri.conf.json
          @'
          {
            "build": {
              "beforeDevCommand": "",
              "beforeBuildCommand": "",
              "devPath": "../dist",
              "distDir": "../dist"
            },
            "package": {
              "productName": "班主任工作台",
              "version": "1.0.0"
            },
            "tauri": {
              "allowlist": {
                "all": true
              },
              "bundle": {
                "active": false,
                "identifier": "com.classmaster.app",
                "icon": ["icons/icon.ico"]
              },
              "security": {
                "csp": null
              },
              "windows": [
                {
                  "title": "班主任工作台 - 智慧班级管理系统",
                  "width": 1280,
                  "height": 820,
                  "minWidth": 960,
                  "minHeight": 640,
                  "resizable": true
                }
              ]
            }
          }
          '@ | Set-Content -Path src-tauri/tauri.conf.json -Encoding UTF8

          # 6. 写入 build.rs
          @'
          fn main() {
              tauri_build::build()
          }
          '@ | Set-Content -Path src-tauri/build.rs -Encoding UTF8

          # 7. 写入 main.rs
          @'
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]
          fn main() {
              tauri::Builder::default()
                  .run(tauri::generate_context!())
                  .expect("运行班主任工作台异常");
          }
          '@ | Set-Content -Path src-tauri/src/main.rs -Encoding UTF8

          # 8. 编译并导出 EXE
          cd src-tauri
          cargo build --release
          cd ..
          Copy-Item src-tauri/target/release/class-master.exe 班主任工作台.exe

      - name: 归档并导出 EXE 文件
        uses: actions/upload-artifact@v4
        with:
          name: 班主任工作台_Windows免安装版
          path: 班主任工作台.exe
